# Referral offices and helplines used by GO-9 (not advice), GO-11 (emergency) and E44.
#
# RULES (blueprint §3.1, §15 human checkpoints):
#   - Every entry is checked by the student against its source_url before `verified: true` is set.
#   - The app shows ONLY entries with verified: true. Unverified entries are ignored at load time.
#   - The model never invents contacts; it can only pick an entry from this file by topic/jurisdiction.
#   - `topics` come from the closed Topic list (GLOSSARY.md "Topic"): identity, passport, tax, health,
#     social_protection, consumer_protection, driving_licence, complaints, rights. Unknown topics are
#     ignored at load time.
#   - `triggers` are Referral triggers found in the question itself, not in a Document: emergency,
#     legal_advice. A legal_advice entry is the fallback when no topic entry matches.
#   - Contacts here are public organisational lines, never personal numbers.
#
# Status: DRAFT (22 Nov 2026). Values marked "from source check" were seen on the official page
# during the read-only check; the others are placeholders to fill and verify.

version: 1
