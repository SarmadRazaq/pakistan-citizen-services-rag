# Local stack. Start only the vector DB:   docker compose up -d qdrant
# Start everything (API in a container):  docker compose --profile api up -d --build
#
# The AntSeed buyer proxy runs on the host (`antseed buyer start`, 127.0.0.1:8377) and is never
# exposed publicly. The API container reaches it through host.docker.internal.

services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "127.0.0.1:6333:6333"   # bound to localhost only
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      ANTSEED_BASE_URL: http://host.docker.internal:8377/v1
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      DATABASE_URL: sqlite+aiosqlite:////data/app.sqlite3
      STORAGE_DIR: /data/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - api_data:/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - qdrant

volumes:
  qdrant_storage:
  api_data:
